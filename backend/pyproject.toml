[project]
name = "comai-backend"
version = "0.2.0"
description = "Backend multi-agents de COMAI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "openai>=1.54,<2.0",
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "redis>=5.2,<6.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "supabase>=2.10,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
asyncio_mode = "auto"
